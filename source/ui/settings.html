<!doctype html>
<meta charset="utf-8">
<title>Pokemon Showdown HD settings</title>
<link rel="stylesheet" href="panels.css">
<style>body{font-family:sans-serif;padding:24px;background:#6a8}body.dark{background:#222;color:#fff}fieldset{display:inline-block;margin-bottom:12px}.row{display:flex;gap:70px;margin:16px 0}.row pokemon-hp{width:300px;flex:none}</style>
<h2>Mega outline</h2>
<fieldset>
  <label><input type="radio" name="style" value="wobble" checked> Wobble</label>
  <label><input type="radio" name="style" value="minimal"> Minimal</label>
  <label><input type="radio" name="style" value="none"> None</label>
</fieldset>
<h2>Preview</h2>
<label><input type="checkbox" id="dark"> dark</label>
<label>hp <input type="range" id="hp" min="0" max="100" value="70"></label>
<div class="phd-layer" style="position:static;overflow:visible">
  <div class="row"><pokemon-hp id="p1"></pokemon-hp><pokemon-hp id="p2"></pokemon-hp></div>
  <div class="row"><pokemon-hp id="e1"></pokemon-hp></div>
</div>
<script src="settings.js"></script>
